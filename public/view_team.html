<!DOCTYPE html>
<html>
  <head>
    <title>View Team Roster</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/playandrlogo.png" />
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 800px;
        text-align: center;
      }
      .header {
        background-color: #f44336;
        color: white;
        padding: 10px;
        border-radius: 8px 8px 0 0;
        margin-bottom: 20px;
      }
      .roster {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .roster-slot {
        width: 150px;
        height: auto;
        border: 1px solid #ccc;
        margin: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 14px;
        border-radius: 4px;
        padding: 10px;
      }
      .artist-image {
        width: 100px;
        height: 100px;
        margin-bottom: 10px;
      }
      .artist-name {
        font-weight: bold;
      }
      .artist-listeners {
        color: #555;
        white-space: pre-wrap;
      }
      .roster-slot.saw-live {
        border: 2px solid #2e7d32;
        background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
        box-shadow: 0 0 8px rgba(46, 125, 50, 0.3);
      }
      .saw-live-badge {
        font-size: 10px;
        font-weight: bold;
        color: #1b5e20;
        background: #a5d6a7;
        padding: 2px 6px;
        border-radius: 4px;
        margin-top: 4px;
      }
      .score-breakdown-btn {
        margin: 10px 0;
        padding: 8px 14px;
        font-size: 13px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .score-breakdown-btn:hover { background: #1557b0; }
      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
      }
      .modal-overlay.show { display: flex; }
      .modal-content {
        background: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 420px;
        width: 90%;
        max-height: 85vh;
        overflow-y: auto;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      }
      .modal-content h3 { margin-top: 0; }
      .modal-content .modal-close { float: right; cursor: pointer; font-size: 20px; }
      .modal-content table { width: 100%; margin-top: 10px; }
      .modal-content th, .modal-content td { padding: 6px 8px; text-align: left; }
      .back-btn {
        padding: 10px 20px;
        background-color: #f44336;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 20px;
      }
      .error-message {
        color: #f44336;
        margin-top: 10px;
        text-align: center;
      }

      /* Mobile-specific styles */
      @media screen and (max-width: 768px) {
        .container {
          width: 95%;
          padding: 15px;
          margin: 10px auto;
        }

        .nav-tabs {
          justify-content: center;
        }

        .nav-tabs li {
          margin: 5px;
        }

        .nav-tabs li a {
          padding: 10px 12px;
          font-size: 14px;
        }

        .roster-slot {
          width: calc(50% - 20px);
          margin: 5px;
        }

        .artist-image {
          width: 80px;
          height: 80px;
        }

        .artist-name {
          font-size: 14px;
        }

        .artist-slot {
          font-size: 12px;
        }

        .artist-listeners {
          font-size: 12px;
        }

        .header {
          font-size: 20px;
          padding: 8px;
        }

        .team-info {
          font-size: 14px;
        }

        .league-info {
          font-size: 14px;
          padding: 8px;
        }

        table {
          font-size: 14px;
        }

        th,
        td {
          padding: 8px;
        }

        .btn {
          width: 100%;
          max-width: 300px;
          margin: 10px auto;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 id="teamName">View Team Roster</h1>
        <div id="teamScoreDisplay" style="font-size: 16px; margin-top: 6px;"></div>
      </div>
      <div style="width: 100%; display: flex; justify-content: center; margin: 12px 0 16px 0;">
        <button type="button" id="scoreBreakdownBtn" class="score-breakdown-btn" style="display: none;">How is this team's score calculated?</button>
      </div>
      <div id="roster" class="roster"></div>
      <div id="scoreBreakdownModal" class="modal-overlay">
        <div class="modal-content">
          <span class="modal-close" id="scoreBreakdownModalClose">&times;</span>
          <h3>Score breakdown</h3>
          <div id="scoreBreakdownBody"></div>
        </div>
      </div>
      <button class="back-btn" onclick="window.location.href='roster.html'">
        Back to Roster
      </button>
    </div>

    <script type="module">
      import { auth, db } from "./firebaseConfig.js?v=1.2";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
      import {
        getDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

      let userEmail = null;
      let teamId = null;
      let leagueId = null;

      function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      document.addEventListener("DOMContentLoaded", async () => {
        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            window.location.href = "index.html";
          } else {
            userEmail = user.email;
            teamId =
              localStorage.getItem("viewedTeamId") ||
              localStorage.getItem("selectedTeamId");
            leagueId = localStorage.getItem("leagueId");

            if (!teamId || !leagueId) {
              alert("No team or league selected. Redirecting to My Teams.");
              window.location.href = "my_teams.html";
            } else {
              await fetchTeamData();
              localStorage.removeItem("viewedTeamId");
            }
          }
        });
      });

      async function fetchTeamData() {
        try {
          const teamDoc = await getDoc(doc(db, "teams", teamId));
          if (teamDoc.exists()) {
            const teamData = teamDoc.data();
            document.getElementById("teamName").textContent = teamData.teamname;

            // Add user email below team name using the correct field
            const ownerEmail = document.createElement("div");
            ownerEmail.textContent = `Owner: ${teamData.userEmail}`;
            ownerEmail.style.fontSize = "14px";
            ownerEmail.style.color = "#fff";
            ownerEmail.style.marginTop = "5px";
            document.getElementById("teamName").appendChild(ownerEmail);

            const scoreDisplay = document.getElementById("teamScoreDisplay");
            if (scoreDisplay && teamData.lastScoreBreakdown && teamData.lastScoreBreakdown.score != null) {
              scoreDisplay.textContent = `Score: ${teamData.lastScoreBreakdown.score}%`;
              scoreDisplay.style.color = "#fff";
            } else if (scoreDisplay) {
              scoreDisplay.textContent = "";
            }

            displayRoster(teamData);
            const scoreBtn = document.getElementById("scoreBreakdownBtn");
            const scoreModal = document.getElementById("scoreBreakdownModal");
            const scoreBody = document.getElementById("scoreBreakdownBody");
            if (scoreBtn) scoreBtn.style.display = "block";
            if (scoreBtn && scoreModal && scoreBody) {
              scoreBtn.onclick = () => {
                const b = teamData.lastScoreBreakdown;
                if (b && b.artists && b.artists.length) {
                  const bonusLabel = (a) => {
                    const parts = [];
                    if (a.sawLive) parts.push("Saw Live");
                    if (a.top5) parts.push("Spotify Top 5");
                    return parts.length ? parts.join(", ") : "—";
                  };
                  const inactive = (b.inactiveArtists || []);
                  const inactiveId = "inactiveArtistsList-" + Date.now();
                  const inactiveSection = inactive.length ? `<p style="margin-top: 14px; font-size: 12px; color: #555;"><button type="button" class="score-breakdown-btn" style="padding: 4px 10px; font-size: 12px;" id="toggleInactiveBtn">${inactive.length} artist(s) not included in score (no listener data)</button></p><div id="${inactiveId}" style="display: none; margin-top: 6px; padding: 8px; background: #f5f5f5; border-radius: 4px; font-size: 13px;">${inactive.map((a) => escapeHtml(a.name)).join(", ")}</div>` : "";
                  scoreBody.innerHTML = `<p><strong>Total score:</strong> ${b.score}% (as of ${b.updatedAt || ""})</p><p style="font-size: 12px; color: #555;">Bonuses: <strong>Saw Live</strong> = 2× when positive (or zeroes out if score is negative); <strong>Spotify Top 5</strong> = +40% to artist score.</p><table><thead><tr><th>Artist</th><th>Contribution</th><th>Bonuses</th></tr></thead><tbody>${b.artists.map((a) => `<tr><td>${escapeHtml(a.name)}</td><td>${a.contribution}%</td><td>${escapeHtml(bonusLabel(a))}</td></tr>`).join("")}</tbody></table>${inactiveSection}`;
                  if (inactive.length) {
                    setTimeout(() => {
                      const btn = document.getElementById("toggleInactiveBtn");
                      const div = document.getElementById(inactiveId);
                      if (btn && div) btn.onclick = () => { div.style.display = div.style.display === "none" ? "block" : "none"; };
                    }, 0);
                  }
                } else {
                  scoreBody.innerHTML = "<p><strong>No breakdown yet.</strong></p><p style=\"font-size: 13px; color: #555;\">The per-artist breakdown is generated when the daily standings job runs. It will appear after the next run. The team's total score may still appear in league standings.</p>";
                }
                scoreModal.classList.add("show");
              };
              document.getElementById("scoreBreakdownModalClose").onclick = () => scoreModal.classList.remove("show");
              scoreModal.onclick = (e) => { if (e.target === scoreModal) scoreModal.classList.remove("show"); };
            }
          } else {
            alert("Team not found. Redirecting to My Teams.");
            window.location.href = "my_teams.html";
          }
        } catch (error) {
          console.error("Error fetching team data:", error);
          document.getElementById("roster").innerHTML =
            "<p>Error loading team data.</p>";
        }
      }

      async function displayRoster(team) {
        const rosterContainer = document.getElementById("roster");
        rosterContainer.innerHTML = "";

        if (!team.artists || Object.keys(team.artists).length === 0) {
          rosterContainer.textContent = "No artists found in your roster.";
          return;
        }

        const artists = team.artists;
        console.log("Artists Data:", artists);

        // Updated slot ordering and labels to match your data
        const slotOrder = ["slot_1", "slot_2", "slot_3", "slot_4", "slot_5"];

        try {
          // Get league rules for thresholds
          const leagueDocRef = doc(db, "leagues", leagueId);
          const leagueDoc = await getDoc(leagueDocRef);

          if (leagueDoc.exists()) {
            const leagueData = leagueDoc.data();
            console.log("League Data:", leagueData);

            if (!leagueData.listenerThresholds) {
              console.error("Listener thresholds are not defined.");
              rosterContainer.textContent =
                "Listener thresholds are not available.";
              return;
            }

            const listenerThresholds = leagueData.listenerThresholds;
            console.log("Listener Thresholds:", listenerThresholds);

            // Create slot labels with thresholds
            const slotLabels = {};
            slotOrder.forEach((slot) => {
              const threshold = listenerThresholds[slot];
              slotLabels[slot] = threshold
                ? `Under ${formatNumberWithCommas(threshold)} Listeners`
                : `Slot ${slot.split("_")[1]}`;
            });

            // Continue with roster display using new labels
            slotOrder.forEach((slotKey) => {
              for (const artistCode in artists) {
                if (
                  artists.hasOwnProperty(artistCode) &&
                  artists[artistCode].active_flg === 1 &&
                  artists[artistCode].slot === slotKey
                ) {
                  const artist = artists[artistCode];
                  const artistElement = document.createElement("div");
                  artistElement.classList.add("roster-slot");
                  const sawLiveIds = (team.sawLiveArtistIds || []).map(String);
                  const artistIdNorm = (artistCode && typeof artistCode === "string" && artistCode.includes("artist/"))
                    ? artistCode.split("artist/")[1].split("?")[0]
                    : (artistCode || "");
                  if (artistIdNorm && sawLiveIds.includes(artistIdNorm)) {
                    artistElement.classList.add("saw-live");
                  }

                  // Add artist image
                  if (artist.imageUrl) {
                    const artistImage = document.createElement("img");
                    artistImage.src = artist.imageUrl;
                    artistImage.alt = artist.name;
                    artistImage.classList.add("artist-image");
                    artistElement.appendChild(artistImage);
                  }

                  // Add artist details
                  const artistName = document.createElement("div");
                  artistName.textContent = artist.name;
                  artistElement.appendChild(artistName);
                  if (artistIdNorm && sawLiveIds.includes(artistIdNorm)) {
                    const badge = document.createElement("div");
                    badge.className = "saw-live-badge";
                    badge.textContent = "Saw Live";
                    artistElement.appendChild(badge);
                  }

                  const artistSlot = document.createElement("div");
                  artistSlot.innerHTML = `<strong>${slotLabels[slotKey]}</strong>`;
                  artistElement.appendChild(artistSlot);

                  // Add listener counts
                  const dateKeys = Object.keys(artist).filter(
                    (key) => !isNaN(Date.parse(key))
                  );
                  if (dateKeys.length > 0) {
                    dateKeys.sort();
                    const baselineCount = artist[dateKeys[0]];
                    let recentCount = artist[dateKeys[dateKeys.length - 1]];

                    // Find the most recent non-null listener count
                    if (recentCount === null) {
                      for (let i = dateKeys.length - 1; i >= 0; i--) {
                        if (artist[dateKeys[i]] !== null) {
                          recentCount = artist[dateKeys[i]];
                          break;
                        }
                      }
                    }

                    const listenerInfo = document.createElement("div");
                    listenerInfo.innerHTML = `
                      <p>Baseline Listeners Count: ${formatNumberWithCommas(
                        baselineCount
                      )}</p>
                      <p>Most Recent Listeners Count: ${
                        recentCount !== null
                          ? formatNumberWithCommas(recentCount)
                          : "No data available"
                      }</p>
                    `;
                    artistElement.appendChild(listenerInfo);
                  }

                  rosterContainer.appendChild(artistElement);
                }
              }
            });
          } else {
            console.error("League document does not exist.");
            rosterContainer.textContent = "League not found.";
          }
        } catch (error) {
          console.error(
            "Error fetching league rules or displaying roster:",
            error
          );
          rosterContainer.textContent = "Error loading roster.";
        }
      }

      function formatNumberWithCommas(x) {
        return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
